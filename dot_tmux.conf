# Dracula a déjà posé la barre : la couper ici, sinon elle reste.
set -g status off
set -g status-left ""
set -g status-right ""
set -g status-style default

# Change the hotkey : Ctrl + spacebar
set-option -g prefix C-Space

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind '%'

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Quick terminal
bind-key T display-popup -w 80% -h 80% -E $SHELL

# Quick SSH connect
bind-key S display-popup -w 80% -h 80% -E '~/.tmux/ssh-hosts.sh'

# Initialize TPM (must be at the bottom)
run '~/.tmux/plugins/tpm/tpm'
