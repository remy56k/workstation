# Kitty remplace Foot. Le bind d'origine est déjà lu, il faut le redéfinir ici.
set $term kitty
# Applications uniquement : pas les commandes du PATH.
set $menu rofi -show drun -modes drun

# --no-warn : ces raccourcis existent déjà dans la config Fedora.
bindsym --no-warn $mod+Return exec $term
bindsym --no-warn $mod+d exec $menu
