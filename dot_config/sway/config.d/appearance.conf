# Fond d'écran
output * bg $HOME/.config/backgrounds/027.jpg fill

font pango:CaskaydiaCove Nerd Font 14

# Bordure fine sans barre de titre, et léger espace entre les tuiles.
# Sway ne sait pas arrondir les coins des fenêtres.
default_border pixel 2
default_floating_border pixel 2
# 4 px entre les fenêtres. Le haut reste à 8 pour garder l'écart sous la barre.
gaps inner 4
gaps top 4

# Couleurs : bordure, fond, texte, indicateur, bordure de la fenêtre.
# Le canal alpha (deux derniers chiffres) rend la bordure translucide.
client.focused          #89b4facc #1e1e2ecc #cdd6f4 #89b4fa #89b4fa99
client.focused_inactive #45475acc #1e1e2eb8 #a6adc8 #45475a #45475a99
client.unfocused        #313244aa #1e1e2eb8 #a6adc8 #313244 #31324499
client.urgent           #f38ba8cc #1e1e2ecc #f38ba8 #f38ba8 #f38ba8aa

# Thunar légèrement translucide. 1 est opaque.
for_window [app_id="thunar"] opacity set 0.85
