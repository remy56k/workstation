# Police du terminal. Les emoji viennent de Noto Emoji (contours) :
# Noto Color Emoji est une police COLRv1 que Kitty ne dessine pas ici.

font_family CaskaydiaCove Nerd Font Mono
font_size 10.0

# Marge à gauche du texte, en points (haut, droite, bas, gauche).
window_padding_width 4 0 0 8

# Traînée du curseur : déclenchée après 20 ms d'immobilité.
cursor_trail 20

# Fond translucide. 1 est opaque.
background_opacity 0.85
